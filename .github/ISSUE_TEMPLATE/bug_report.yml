name: 问题反馈
description: 提供可复现的游戏、联机或构建问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: 版本或 commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、显卡、窗口尺寸；联机时补充人数和 AI 配置。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 包括地图、战车、武器或道具；请勿提供真实密码或令牌。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际表现
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图、视频或去敏日志
